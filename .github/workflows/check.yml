name: Provera JGSP obaveštenja

on:
  schedule:
    - cron: "17 4 * * *"   # 5:17 zimi, 6:17 leti po našem vremenu
    - cron: "7 16 * * *"   # 17:07 zimi, 18:07 leti po našem vremenu
  workflow_dispatch:       # ručno pokretanje

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Proveri obaveštenja
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 check.py
      - name: Sačuvaj viđena obaveštenja
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || { git commit -m "Ažuriraj viđena obaveštenja"; git push; }
      - name: Javi grešku
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: >
          curl -fsS -H "Title: JGSP provera nije uspela"
          -d "Pogledaj GitHub Actions za detalje." "https://ntfy.sh/$NTFY_TOPIC"
